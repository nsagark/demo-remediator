# Requests far above actual usage (pause container uses ~0 CPU / ~1Mi).
# Expect vpa-cpu-alignment-check / vpa-memory-alignment-check: over-provisioning.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overprovisioned
  namespace: ro-demo
  labels: {app: overprovisioned}
spec:
  replicas: 1
  selector: {matchLabels: {app: overprovisioned}}
  template:
    metadata: {labels: {app: overprovisioned}}
    spec:
      containers:
      - name: app
        image: registry.k8s.io/pause:3.10
        resources:
          requests: {cpu: "2", memory: 1Gi}
          limits: {cpu: "2", memory: 1Gi}
