# Control: requests inside the VPA band -> pass.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: rightsized
  name: rightsized
  namespace: ro-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rightsized
  template:
    metadata:
      labels:
        app: rightsized
    spec:
      containers:
        - image: nginx:1.27-alpine
          name: app
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 15m
              memory: 100Mi
