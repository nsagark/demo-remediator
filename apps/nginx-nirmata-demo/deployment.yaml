apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
    nirmata.io/resource-optimization: "enabled"
    nirmata.io/remediation-path: "create-pr"
  annotations:
    container.apparmor.security.beta.kubernetes.io/nginx: unconfined
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      volumes:
      - name: host-vol
        hostPath:
          path: /etc
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
          hostPort: 80
        securityContext:
          privileged: true
          capabilities:
            add:
            - SYS_ADMIN
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-compliant
  labels:
    app: nginx-compliant
    nirmata.io/resource-optimization: "enabled"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-compliant
  template:
    metadata:
      labels:
        app: nginx-compliant
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 8080
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-compliant-init
  labels:
    app: nginx-compliant-init
    nirmata.io/resource-optimization: "enabled"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-compliant-init
  template:
    metadata:
      labels:
        app: nginx-compliant-init
    spec:
      initContainers:
      - name: setup
        image: busybox:1.36
        command: ["sh","-c","echo ready"]
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 8080
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-compliant-2
  labels:
    app: nginx-compliant-2
    nirmata.io/resource-optimization: "enabled"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-compliant-2
  template:
    metadata:
      labels:
        app: nginx-compliant-2
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "128Mi"
            cpu: "100m"
          requests:
            memory: "64Mi"
            cpu: "50m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-compliant-3
  labels:
    app: nginx-compliant-3
    nirmata.io/resource-optimization: "enabled"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-compliant-3
  template:
    metadata:
      labels:
        app: nginx-compliant-3
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 8080
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
      - name: sidecar
        image: alpine:3.20
        command: ["tail", "-f", "/dev/null"]
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-compliant-4
  labels:
    app: nginx-compliant-4
    nirmata.io/resource-optimization: "enabled"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-compliant-4
  template:
    metadata:
      labels:
        app: nginx-compliant-4
    spec:
      initContainers:
      - name: config
        image: alpine:3.20
        command:
        - sh
        - -c
        - |
          echo "Initializing nginx config..." > /etc/config/status.txt
          echo "Config ready" >> /etc/config/status.txt
        volumeMounts:
        - name: config-vol
          mountPath: /etc/config
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config-vol
          mountPath: /etc/config
          readOnly: true
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
      volumes:
      - name: config-vol
        emptyDir: {}
