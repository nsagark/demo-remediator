# Control: requests inside the VPA band -> pass.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rightsized
  namespace: ro-demo
  labels: {app: rightsized}
spec:
  replicas: 1
  selector: {matchLabels: {app: rightsized}}
  template:
    metadata: {labels: {app: rightsized}}
    spec:
      containers:
      - name: app
        image: nginx:1.27-alpine
        resources:
          requests: {cpu: 15m, memory: 100Mi}
          limits: {cpu: 200m, memory: 256Mi}
