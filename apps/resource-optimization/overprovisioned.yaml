# Requests far above actual usage (pause container uses ~0 CPU / ~1Mi).
# Expect vpa-cpu-alignment-check / vpa-memory-alignment-check: over-provisioning.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: overprovisioned
  name: overprovisioned
  namespace: ro-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: overprovisioned
  template:
    metadata:
      labels:
        app: overprovisioned
    spec:
      containers:
        - image: registry.k8s.io/pause:3.10
          name: app
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 15m
              memory: 100Mi
