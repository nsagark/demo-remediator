apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-rc3-clean
  namespace: default
  labels:
    app: nginx-rc3-clean
    test: v0-2-9-rc-3-anthropic-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-rc3-clean
  template:
    metadata:
      labels:
        app: nginx-rc3-clean
    spec:
      volumes:
        - name: host-etc
          emptyDir: {}
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsUser: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: host-etc
              mountPath: /host-etc
