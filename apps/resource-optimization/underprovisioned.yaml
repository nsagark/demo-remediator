# Requests below the VPA lower bound (recommender floor is 15m CPU / 100Mi memory).
# Expect vpa-cpu-alignment-check / vpa-memory-alignment-check: under-provisioning.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: underprovisioned
  name: underprovisioned
  namespace: ro-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: underprovisioned
  template:
    metadata:
      labels:
        app: underprovisioned
    spec:
      containers:
        - image: nginx:1.27-alpine
          name: app
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 15m
              memory: 100Mi
