apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-rc3-anthropic
  namespace: default
  labels:
    app: nginx-rc3-anthropic
    test: v0-2-9-rc-3-anthropic-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-rc3-anthropic
  template:
    metadata:
      labels:
        app: nginx-rc3-anthropic
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: host-etc
          emptyDir: {}
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 0
            capabilities:
              add:
                - SYS_ADMIN
                - NET_RAW
          volumeMounts:
            - name: host-etc
              mountPath: /host-etc
